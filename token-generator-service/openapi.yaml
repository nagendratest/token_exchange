openapi: 3.0.3
info:
  title: Token Exchange Service API
  version: 1.0.0
  description: API for exchanging credentials with EOrchestrator and ENM.
paths:
  /eorchestrator/tokens:
    post:
      summary: Get EOrchestrator token
      description: Exchanges basic credentials for an EOrchestrator token.
      operationId: getEOrchestratorToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EOrchestratorTokenRequest'
      responses:
        '200':
          description: Upstream token response
          content:
            application/json:
              schema:
                type: string
        '400':
          description: Validation error
  /enm/login:
    post:
      summary: Login to ENM
      description: Exchanges ENM credentials for a login session.
      operationId: loginEnm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnmLoginRequest'
      responses:
        '200':
          description: Access token from the iPlanetDirectoryPro cookie
          content:
            text/plain:
              schema:
                type: string
        '400':
          description: Validation error
components:
  schemas:
    EOrchestratorTokenRequest:
      type: object
      required:
        - username
        - password
        - tenantId
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
        tenantId:
          type: string
          minLength: 1
    EnmLoginRequest:
      type: object
      required:
        - username
        - password
        - tenantId
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
        tenantId:
          type: string
          minLength: 1
