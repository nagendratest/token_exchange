apiVersion: apps/v1
kind: Deployment
metadata:
  name: token-generator-service
  namespace: apigw-token-service
  labels:
    app.kubernetes.io/name: token-generator-service
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: token-generator-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: token-generator-service
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: token-generator-service
          image: token-generator-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: ENM_BASE_URL
              value: https://te.testmob.de
            - name: ENM_RESOLVE_HOST
              value: te.testmob.de
            - name: ENM_RESOLVE_PORT
              value: "443"
            - name: ENM_RESOLVE_ADDRESS
              value: 10.118.123.174
            - name: ENM_INSECURE_TLS
              value: "true"
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
