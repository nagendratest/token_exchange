openapi: 3.0.3
info:
  title: Token Cache API
  version: 1.0.0
  description: API for fetching OAuth tokens with caching.
paths:
  /token:
    post:
      summary: Get token
      description: Returns an OAuth access token for the provided tenant and client.
      operationId: getToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: Token response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResult'
        '400':
          description: Validation error
components:
  schemas:
    TokenRequest:
      type: object
      required:
        - tenantId
        - clientId
        - clientSecret
      properties:
        tenantId:
          type: string
          minLength: 1
        clientId:
          type: string
          minLength: 1
        clientSecret:
          type: string
          minLength: 1
    TokenResult:
      type: object
      required:
        - accessToken
        - tokenType
        - expiresAtEpochMillis
        - cached
        - tenantId
        - clientId
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
        expiresAtEpochMillis:
          type: integer
          format: int64
        cached:
          type: boolean
        tenantId:
          type: string
        clientId:
          type: string
